<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada del reel · Próximamente nueva web</title>
<link rel="stylesheet" href="campana.css">
<style>
  /* Título y marca dentro del recorte 3:4 de la grilla del perfil (1080×1440, y 240–1680); también entran en el 4:5 anterior (y 285–1635). */
  .foto { left: 0; top: 0; width: 1080px; height: 1060px; }
  .foto img { object-position: 50% 62%; }
  .texto { position: absolute; left: 80px; top: 1110px; width: 920px; text-align: center; }
  .volanta { font-size: 28px; margin-bottom: 26px; }
  .titular { font-size: 104px; }
  .titular em { display: block; }
  .usuario { position: absolute; left: 0; width: 1080px; top: 1760px; text-align: center; font-size: 32px; color: var(--texto-suave); }
  .logo { position: absolute; left: 50%; top: 1410px; width: 300px; transform: translateX(-50%); }
</style>
</head>
<body>
<main class="lienzo vertical">
  <div class="foto"><img src="../../../../src/assets/images/productos/producto-funda-nordica-lino.webp" alt="Dormitorio con la funda nórdica de lino y algodón blanca, una manta beige y una bandeja sobre la cama"></div>
  <div class="texto">
    <p class="volanta">Próximamente</p>
    <h1 class="titular">Nuestra<em>nueva web</em></h1>
  </div>
  <img class="logo" src="../../../../src/assets/images/logo/logo-piuma-terracota.webp" alt="Piuma · Ropa de cama">
  <p class="usuario">@piuma_uy</p>
</main>
</body>
</html>
