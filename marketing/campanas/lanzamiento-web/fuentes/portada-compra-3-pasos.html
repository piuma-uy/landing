<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada · Comprá en 3 pasos</title>
<link rel="stylesheet" href="campana.css">
<style>
  .titulo { font-size: 92px; top: 330px; }
  .titulo .punto { color: var(--color-primary); padding: 0 0.12em; }
  .telefono.chico { left: 286px; top: 500px; width: 508px; height: 1067px; border-radius: 52px; padding: 14px; }
  .telefono.chico .pantalla { width: 480px; height: 1039px; border-radius: 40px; }
  .telefono.chico .pantalla img { position: absolute; inset: 0; width: 480px; height: 1039px; }
</style>
</head>
<body>
<!-- Dentro del recorte 4:5 (y 285–1635) y del 3:4. La pantalla es un cuadro real de compra-3-pasos (ficha del Chiara). -->
<div class="lienzo">
  <p class="titulo">Elegí<span class="punto">·</span>Agregá<span class="punto">·</span>Pagá</p>
  <div class="telefono chico"><div class="pantalla"><img id="cuadro" alt=""></div></div>
</div>
</body>
</html>
