# Secret scan (T84): gitleaks over the whole git history with .gitleaks.toml on every pull request and on pushes to
# main or tienda-local. The gitleaks CLI is downloaded at a pinned version and checked against the release SHA-256 instead of
# using gitleaks/gitleaks-action, which needs a registered license for organization repos and pull-requests: write
# (see piuma-backend docs/harness/decisions.md). Findings are redacted in the log.
name: Secret scan
on:
  pull_request:
  push:
    branches: [main, tienda-local]
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Self-test of the rules
        run: bash scripts/gitleaks-selftest.sh .gitleaks.toml
      - name: Scan the full history
        run: gitleaks git --log-opts=--all --config .gitleaks.toml --redact --no-banner --verbose .
