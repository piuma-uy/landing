<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <title>Piuma | Ropa de cama en Uruguay: sábanas y acolchados</title>
    <!-- viewport-fit=cover: sin él env(safe-area-inset-*) vale 0 en Safari iOS. Sin interactive-widget:
         la barra del checkout (T72) detecta el teclado porque achica sólo el viewport visual. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Sábanas, acolchados, fundas nórdicas, cubrecamas y almohadas de algodón, pluma y lino. Envío gratis en zonas de Montevideo y Canelones."
    />
    <meta name="theme-color" content="#faf7f2" />
    <!-- Sólo hay paleta clara: que el modo oscuro del sistema no oscurezca la página por su cuenta. -->
    <meta name="color-scheme" content="only light" />

    <!-- Open Graph / redes sociales. scripts/prerender.ts pone en cada página su título, descripción,
         imagen de 1200x630 con URL absoluta (SITE_URL), og:url, canonical, hreflang y Twitter. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Piuma | Ropa de cama en Uruguay: sábanas y acolchados" />
    <meta
      property="og:description"
      content="Sábanas, acolchados, fundas nórdicas, cubrecamas y almohadas de algodón, pluma y lino. Envío gratis en zonas de Montevideo y Canelones."
    />
    <meta property="og:image" content="assets/images/og/inicio.jpg" />
    <meta property="og:locale" content="es_UY" />

    <!-- main.ts lo lee antes de arrancar: pedirlo ya, en paralelo con los scripts (LCP). -->
    <link rel="preload" href="runtime-config.json" as="fetch" crossorigin />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
