<header
  class="header"
  [class.header--scrolled]="scrolled()"
  [class.header--commerce]="shop.enabled"
>
  <div class="header__inner container">
    <a
      href="#inicio"
      class="logo"
      (click)="closeMenu(); shop.section('inicio')"
    >
      <img
        src="assets/images/logo/logo-piuma-terracota-300w.webp"
        srcset="assets/images/logo/logo-piuma-terracota-150w.webp 150w, assets/images/logo/logo-piuma-terracota-300w.webp 300w"
        sizes="(min-width: 768px) 88px, 72px"
        [alt]="config.brandName + ' — ropa de cama'"
        width="600"
        height="316"
      />
    </a>

    <button
      type="button"
      class="header__toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="nav-principal"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="toggleMenu()"
    >
      <span class="header__toggle-bar" [class.is-open]="menuOpen()"></span>
    </button>

    <nav
      id="nav-principal"
      class="nav"
      [class.nav--open]="menuOpen()"
      aria-label="Navegación principal"
    >
      <ul class="nav__list">
        @for (link of navLinks; track link.fragment) {
          <li>
            <a
              class="nav__link"
              [href]="'#' + link.fragment"
              (click)="closeMenu(); shop.section(link.fragment)"
              >{{ link.label }}</a
            >
          </li>
        }
        @if (shop.enabled) {
          <li>
            <button
              class="nav__link nav__button"
              (click)="closeMenu(); shop.open('account')"
            >
              {{ shop.user() ? "Mi cuenta" : "Ingresar" }}
            </button>
          </li>
          @if (shop.user()?.admin) {
            <li>
              <button
                class="nav__link nav__button"
                (click)="closeMenu(); shop.open('admin')"
              >
                Administrar
              </button>
            </li>
          }
        }
      </ul>
      <app-social-links
        class="nav__social"
        [networks]="['instagram', 'whatsapp']"
      />
    </nav>

    @if (shop.enabled) {
      <!-- Fuera del menú: en el teléfono el carrito se ve siempre, con su cantidad. -->
      <button
        type="button"
        class="cart-button"
        [class.cart-button--active]="shop.view() === 'cart'"
        [attr.aria-label]="'Carrito (' + shop.cartCount() + ')'"
        (click)="closeMenu(); shop.open('cart')"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M6 7h12l-1 13H7L6 7Zm3 0V6a3 3 0 0 1 6 0v1"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
        </svg>
        <span class="cart-button__label">Carrito</span>
        <!-- Se dibuja de nuevo con cada cambio de cantidad: el rebote acompaña al agregado. -->
        @for (n of [shop.cartCount()]; track n) {
          @if (n) {
            <span class="cart-button__count" aria-hidden="true">{{ n }}</span>
          }
        }
      </button>
    }
  </div>
</header>
