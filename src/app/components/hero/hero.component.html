<section id="inicio" class="hero">
  <div class="hero__inner container">
    <div class="hero__content">
      <span class="eyebrow">Textiles para el hogar</span>
      <h1 class="hero__title">{{ config.brandName }}</h1>
      <p class="hero__tagline">
        En Piuma seleccionamos ropa de cama de calidad, con productos que combinan confort y estilo
        para transformar cada dormitorio en un espacio cálido y especial para que descanses.
      </p>
      <div class="hero__actions">
        <a
          [href]="whatsappLink"
          class="btn btn--primary"
          target="_blank"
          rel="noopener noreferrer"
        >
          Consultar por WhatsApp
        </a>
      </div>
    </div>

    <div class="hero__media">
      <img
        [src]="heroImage"
        alt="Cama tendida con un acolchado de pluma natural blanco de Piuma"
        width="1600"
        height="1067"
        fetchpriority="high"
      />
    </div>
  </div>
</section>
